name: Integration

# Real-browser tests (marker "integration"): the sample shop in Chromium and the whole
# `aitaf run` pipeline (Unit 6, U6-9). Slower than CI, so it runs on pull requests to
# develop and main and on request. Mock provider only: no live LLM calls, no secrets (ADR-026).

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  LLM_PROVIDER: mock

jobs:
  integration:
    name: integration (ubuntu, chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-report.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-report.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Integration tests
        run: python -m pytest -m integration --no-cov -q
      - name: Keep evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-evidence
          path: |
            reports/
            junit*.xml
          if-no-files-found: ignore
          retention-days: 7
