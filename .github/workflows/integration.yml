name: Integration

# Real-browser tests (marker "integration"): the sample shop in Chromium and the whole
# `aitaf run` pipeline (Unit 6, U6-9). Slower than CI, so it runs on pull requests to
# develop and main, on pushes to develop and on request. Mock provider only: no live LLM calls, no secrets (ADR-026).

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  LLM_PROVIDER: mock

jobs:
  integration:
    name: integration (ubuntu, chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-report.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-report.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Integration tests
        run: python -m pytest -m integration --no-cov -q
      - name: Keep evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-evidence
          path: |
            reports/
            junit*.xml
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: docker image (build and demo run)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build the image (no push)
        run: |
          if ! docker build --progress=plain -t aitaf:ci . > build.log 2>&1; then
            tail -n 40 build.log
            echo "::error title=docker build failed::$(tail -n 12 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
      - name: Command line works inside the image
        run: docker run --rm aitaf:ci --help
      - name: Whole pipeline on the demo shop inside the container (mock provider)
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm --ipc=host -v "$PWD/out:/app/reports" aitaf:ci run \
            --input data/requirements/shop_requirements.md --db reports/aitaf.db \
            --out-dir reports/pipeline --demo-shop --approve-all
          test -f out/pipeline/dashboard/dashboard.html
      - name: Keep the output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-demo-output
          path: out/
          if-no-files-found: ignore
          retention-days: 7
