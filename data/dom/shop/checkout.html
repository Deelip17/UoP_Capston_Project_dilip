<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Demo Shop - Payment</title>
<style>body{font-family:Arial,sans-serif;max-width:640px;margin:2rem auto;color:#222}nav{margin-bottom:1rem}.btn{padding:.4rem .9rem;background:#1b5e9b;color:#fff;border:0;border-radius:4px;cursor:pointer}.field{display:block;margin:.3rem 0 1rem;padding:.4rem;width:18rem}.error{color:#b00020}li{margin:.6rem 0}</style>
</head>
<body>
<h1>Checkout</h1>
<form method="post" action="/checkout">
<label for="ship-name">Full name</label>
<input id="ship-name" class="field field-name" data-qa="ship-fullname" type="text" name="name" placeholder="Full name">
<button id="place-order" class="btn btn-place-order" data-qa="order-submit" type="submit">Place order</button>
</form>
</body>
</html>
