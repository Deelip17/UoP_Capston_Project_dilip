<!DOCTYPE html>
<html>
<head><title>Demo Shop - Sign in</title></head>
<body>
<header>
  <nav><a href="/">Home</a><a href="/cart">Cart</a></nav>
</header>
<main>
  <form id="login-form" action="/login" method="post">
    <h1>Sign in</h1>
    <label for="user-email">Email</label>
    <input id="user-email" name="email" type="email" class="form-control" placeholder="you@example.test">
    <label for="password-input">Password</label>
    <input id="password-input" name="password" type="password" class="form-control">
    <button id="btn-login-9f2" type="submit" class="btn btn-primary">Sign in</button>
    <a class="forgot" href="/reset">Forgot password?</a>
  </form>
</main>
</body>
</html>
