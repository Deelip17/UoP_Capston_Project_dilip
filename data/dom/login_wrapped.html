<!DOCTYPE html>
<html>
<head><title>Demo Shop - Sign in</title></head>
<body>
<header>
  <nav><a href="/">Home</a><a href="/cart">Cart</a></nav>
</header>
<main>
  <div class="container">
    <div class="card">
      <form id="login-form" action="/login" method="post">
        <h1>Sign in</h1>
        <label for="email-input">Email</label>
        <input id="email-input" name="email" type="email" class="form-control" placeholder="you@example.test">
        <label for="password-input">Password</label>
        <input id="password-input" name="password" type="password" class="form-control">
        <button id="submit-9" type="button" class="btn btn-primary">Sign in</button>
        <a class="forgot" href="/reset">Forgot password?</a>
      </form>
    </div>
  </div>
</main>
</body>
</html>
