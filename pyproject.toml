[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitaf"
description = "AI-powered test automation framework (MSIT capstone prototype)"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version", "dependencies"]

[project.scripts]
aitaf = "aitaf.cli:main"

[tool.setuptools.dynamic]
version = { attr = "aitaf.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests/support"]
addopts = "-ra --strict-markers -m \"not integration and not system\""
markers = [
  "blackbox: behaviour tests through the public API (Unit 5 Part B evidence)",
  "whitebox: branch and validator tests exercising internals (Unit 5 Part B evidence)",
  "integration: needs a real browser (Chromium); excluded by default, run with -m integration",
  "system: the whole pipeline end to end in a real browser (Unit 7); excluded by default, run with -m system",
]

[tool.coverage.run]
source = ["src/aitaf"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "reports", "dist", "evidence"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The HTML report is written as long tag strings; splitting them would hurt readability.
"src/aitaf/reporting/render_html.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*", "matplotlib", "matplotlib.*"]
ignore_missing_imports = true
