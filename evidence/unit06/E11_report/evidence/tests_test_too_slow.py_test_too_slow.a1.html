<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<title>Demo Shop - Account access</title>
<style>body{font-family:Arial,sans-serif;max-width:640px;margin:2rem auto;color:#222}nav{margin-bottom:1rem}.btn{padding:.4rem .9rem;background:#1b5e9b;color:#fff;border:0;border-radius:4px;cursor:pointer}.field{display:block;margin:.3rem 0 1rem;padding:.4rem;width:18rem}.error{color:#b00020}li{margin:.6rem 0}</style>
</head>
<body>
<h1>Welcome to the Demo Shop</h1>
<form method="post" action="/login">
<label for="username">Email</label>
<input id="username" class="field field-username" data-qa="login-user" type="text" name="username" placeholder="Email address">
<label for="password">Password</label>
<input id="password" class="field field-password" data-qa="login-pass" type="password" name="password" placeholder="Password">
<button id="signin-btn" class="btn btn-login" data-qa="login-submit" type="submit">Log in</button>
</form>
<p class="hint">Demo account: demo@example.com / demo-pass (synthetic).</p>


</body></html>
